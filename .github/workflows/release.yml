name: release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fetch pdfium
        shell: pwsh
        run: ./packaging/fetch-pdfium.ps1

      - name: Fetch WebView2 offline installer
        shell: pwsh
        run: ./packaging/fetch-webview2.ps1

      - name: Build frontend
        working-directory: crates/desktop/ui
        run: |
          npm ci
          npm run build

      # mpa-desktop's test binary carries a requireAdministrator manifest, so it
      # cannot start from a non-elevated runner. Clippy still compiles it.
      - name: Tests + lints
        run: |
          cargo test --workspace --exclude mpa-desktop --locked
          cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Release binaries
        run: cargo build --release --locked -p mpa-cli -p mpa-desktop

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Package installer
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$version" packaging\mpa.iss

      # Signing needs the release key. Without the secret the installer is still
      # built and published unsigned, so a fork or a dry run can produce one; the
      # manifest then carries no signature instead of a broken one.
      - name: Detect signing key
        id: signing
        shell: pwsh
        env:
          MPA_MINISIGN_KEY: ${{ secrets.MPA_MINISIGN_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:MPA_MINISIGN_KEY)) {
            "has_key=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "has_key=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Sign installer
        if: steps.signing.outputs.has_key == 'true'
        shell: pwsh
        env:
          MPA_MINISIGN_KEY: ${{ secrets.MPA_MINISIGN_KEY }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $setup = "Output\mpa-$version-setup.exe"
          cargo install rsign2 --locked
          # Write the secret to a temp file (removed right after signing).
          $keyFile = "$env:RUNNER_TEMP\minisign.key"
          $env:MPA_MINISIGN_KEY | Out-File $keyFile -Encoding utf8 -NoNewline
          & "$env:USERPROFILE\.cargo\bin\rsign" sign $setup -s $keyFile -x "$setup.minisig" -W
          Remove-Item $keyFile -Force

      - name: Build manifest
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $setup = "Output\mpa-$version-setup.exe"
          $hash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          $sig = if (Test-Path "$setup.minisig") { Get-Content "$setup.minisig" -Raw } else { $null }
          @{ version = $version
             url = "https://github.com/${{ github.repository }}/releases/download/v$version/mpa-$version-setup.exe"
             sha256 = $hash
             signature = $sig
             notes = $null } | ConvertTo-Json | Out-File Output\latest.json -Encoding utf8

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            Output/mpa-*-setup.exe
            Output/mpa-*-setup.exe.minisig
            Output/latest.json
          fail_on_unmatched_files: false
