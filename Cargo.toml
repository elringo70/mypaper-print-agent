[workspace]
resolver = "2"
members = ["crates/domain", "crates/spool", "crates/analyzer", "crates/agent", "crates/sync", "crates/update", "crates/cli", "crates/ui", "crates/desktop", "crates/ipp"]
exclude = ["third-party/xattr"]

[patch.crates-io]
# Vendored one-line fix: xattr 0.2.3 (pinned by zed-async-tar via gpui)
# references libc::ENOATTR, gone from newer libc on Linux (= ENODATA).
xattr = { path = "third-party/xattr" }

# Shared lint set (rust-best-practices ch.2): correctness denies, rest warns.
# `unsafe_code` stays allowed: the WinSpool backend needs raw FFI.
[workspace.lints.rust]
missing_debug_implementations = "warn"
missing_docs = "allow"

[workspace.lints.clippy]
all = "warn"
perf = "warn"
redundant_clone = "warn"
needless_collect = "warn"
