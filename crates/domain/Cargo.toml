[package]
name = "mpa-domain"
version = "0.2.0"
publish = false
edition = "2021"

[dependencies]
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# TypeScript bindings for the wire contract. Off by default: the agent binary
# never needs it, only `cargo test --features ts`.
ts-rs = { version = "12", optional = true }

[features]
ts = ["dep:ts-rs"]

[dev-dependencies]
toml = "0.8"

[lints]
workspace = true
