[package]
name = "mpa-sync"
version = "0.2.0"
publish = false
edition = "2021"

[dependencies]
mpa-domain = { path = "../domain" }
mpa-agent = { path = "../agent" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls-manual-roots"] }
# Device identity: requests are signed with Ed25519 so a leaked bearer key is
# not enough to talk to MyPaper. BSD-3, no runtime cost beyond one signature.
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# TypeScript bindings for the HTTP contract with the webapp. Off by default.
ts-rs = { version = "12", optional = true, features = ["serde-json-impl"] }

[features]
ts = ["dep:ts-rs", "mpa-domain/ts"]

[dev-dependencies]
mpa-analyzer = { path = "../analyzer" }
mpa-spool = { path = "../spool" }

[lints]
workspace = true
