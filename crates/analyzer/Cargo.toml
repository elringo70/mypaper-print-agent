[package]
name = "mpa-analyzer"
version = "0.2.0"
edition = "2021"

[dependencies]
mpa-domain = { path = "../domain" }
serde = { version = "1", features = ["derive"] }
thiserror = "2"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "pnm"] }

[dev-dependencies]
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp", "pnm"] }

# GDI playback for EMF rasterization (Windows-only seam).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi"] }

[lints]
workspace = true
