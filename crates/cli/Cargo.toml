[package]
name = "mpa-cli"
version = "0.3.0"
publish = false
edition = "2021"

[[bin]]
name = "mpa"
path = "src/main.rs"

[dependencies]
mpa-domain = { path = "../domain" }
mpa-spool = { path = "../spool" }
mpa-analyzer = { path = "../analyzer", features = ["pdfium"] }
mpa-agent = { path = "../agent" }
mpa-sync = { path = "../sync" }
mpa-ipp = { path = "../ipp" }
mpa-update = { path = "../update" }
clap = { version = "4", features = ["derive"] }
thiserror = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"

[lints]
workspace = true
