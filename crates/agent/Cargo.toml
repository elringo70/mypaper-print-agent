[package]
name = "mpa-agent"
version = "0.2.0"
publish = false
edition = "2021"

[dependencies]
chrono = "0.4"
mpa-domain = { path = "../domain" }
mpa-spool = { path = "../spool" }
mpa-analyzer = { path = "../analyzer", features = ["pdfium"] }
mpa-ipp = { path = "../ipp" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
dirs = "6"
thiserror = "2"
sha2 = "0.10"
hex = "0.4"
base64 = "0.22"

[lints]
workspace = true
